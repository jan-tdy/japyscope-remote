name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '✨ Features'
    labels:
      - enhancement
  - title: '🐛 Fixes'
    labels:
      - bug
  - title: '🔒 Security'
    labels:
      - security
      - vulnerability
      - critical
  # Docs-only changes (README, docs/*.md, CLAUDE.md, etc.) -- no code, so
  # neither a fix nor a feature. Without its own category these fall
  # through to the un-categorized "What's Changed" list above every
  # section, which reads like an orphaned entry rather than a real one.
  - title: '📝 Documentation'
    labels:
      - documentation
  - title: '📦 Dependency Updates'
    labels:
      - dependencies

exclude-labels:
  - skip-changelog

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

version-resolver:
  minor:
    labels:
      - enhancement
  patch:
    labels:
      - bug
      - security
      - vulnerability
      - critical
      - dependencies
      - documentation
  default: patch

# This repo's actual PR titles are plain imperative sentences ("Add X",
# "Fix X", "Bump X") rather than conventional-commit prefixes -- keep the
# feat:/fix:/docs: patterns for any PR that does use them, but match on
# the leading verb too so ordinary titles actually get labeled.
autolabeler:
  - label: enhancement
    branch:
      - '/^feature\/.+/i'
    title:
      - '/^feat(ure)?(\(.+\))?!?:/i'
      - '/^add\b/i'
  - label: bug
    branch:
      - '/^(fix|bugfix)\/.+/i'
    title:
      - '/^fix(\(.+\))?!?:/i'
      - '/^fix\b/i'
  - label: security
    branch:
      - '/^(security|vulnerability|vuln|critical)\/.+/i'
    title:
      - '/^(security|vulnerability|vuln|critical)(\(.+\))?!?:/i'
      - '/^(fix|patch|secure|harden)(.*)(security|vulnerability|vuln|critical)/i'
      - '/^(fix|patch|address|resolve).*\b(security|vulnerability|vuln|critical)\b/i'
  # Dependabot already labels its own PRs "dependencies"; this also
  # catches manual version bump PRs ("Bump X to Y") by title/branch.
  - label: dependencies
    title:
      - '/^(chore\(deps\)|bump)/i'
    branch:
      - '/^bump\/.+/i'
  - label: documentation
    title:
      - '/^docs(\(.+\))?:/i'
      - '/^(add.*documentation|add.*guidance)/i'
    branch:
      - '/^docs\/.+/i'

template: |
  ## What's Changed

  $CHANGES
