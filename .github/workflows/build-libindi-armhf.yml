name: Build libindi core (armhf, Bullseye, ARMv6)

# Raspberry Pi OS Bullseye Lite's own apt libindi-dev (1.8.8+dfsg-1) predates
# the INDI::PropertyView-family headers (indipropertyview.h,
# indipropertybasic.h, etc.) that current pyindi-client's SWIG interface
# needs — see docs/TROUBLESHOOTING.md. There is no apt repository that ships
# a newer libindi-dev for armhf/Bullseye (confirmed dead end — see the INDI
# forum thread "INDI needs a new apt repository for Debian ARM"), and
# compiling INDI core on a Pi Zero W itself (single ARM11 core, 512 MB RAM,
# already SD-card-constrained) is impractical and risky.
#
# This workflow cross-builds INDI core instead, entirely on GitHub's
# infrastructure: it boots the actual Raspberry Pi OS Bullseye armhf image
# under QEMU (not a generic Debian docker image — a plain armhf/armv7 image
# would produce binaries that illegal-instruction-crash on the Zero W's
# ARMv6 CPU), builds INDI core inside it, and packages just the new headers
# + client library. install.sh downloads that tarball into /usr/local
# (already one of pyindi-client's SWIG search paths) instead of building
# anything on the Pi. The Pi's existing apt indi-bin/libindi-dev (and the
# indiserver/driver processes using them) are untouched.

on:
  workflow_dispatch:
    inputs:
      indi_ref:
        description: "indilib/indi git tag/branch to build"
        required: true
        default: "v2.2.4"
  push:
    tags:
      - "libindi-armhf-v*"

permissions:
  contents: write

jobs:
  build:
    # Pinned, not ubuntu-latest: current GitHub ubuntu-latest (24.04) ships a
    # qemu-user-static that segfaults immediately on the first command run
    # inside arm-runner-action's chroot for older ARM CPU models (arm1176) —
    # a known, still-open upstream issue, not something fixable here. 22.04
    # is one of the action's own tested runner versions.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve INDI ref
        id: ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            ref="${GITHUB_REF_NAME#libindi-armhf-}"
          else
            ref="${{ inputs.indi_ref }}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Build INDI core under QEMU (Raspberry Pi OS Bullseye armhf, ARMv6)
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspi_2_bullseye:20230102
          # arm1176 (the "most compatible for old Pi models" option) hits a
          # QEMU TCG segfault on the very first emulated command with the
          # qemu-user-static currently on GitHub's runners (reproduced
          # identically on both ubuntu-22.04 and ubuntu-latest/24.04 — not a
          # runner-version issue). cortex-a7 is QEMU's far more mature,
          # heavily-exercised ARM CPU model and is a strict instruction
          # superset of ARMv6, so it emulates the same real binaries
          # correctly; the actual output instruction set is still governed
          # by this Raspberry Pi OS image's own toolchain default
          # (-march=armv6+vfp), not by which CPU QEMU pretends to be.
          cpu: cortex-a7
          image_additional_mb: 4096
          bind_mount_repository: true
          commands: |
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            # Debian 11 (Bullseye) is EOL: security.debian.org 404s on every
            # package (deb.debian.org's main pocket still resolves fine, it's
            # only the separate security infrastructure that's gone dark).
            # Drop those sources rather than fixing them — this is a
            # throwaway build sandbox, security patches are irrelevant here.
            grep -rl security.debian.org /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sed -i '/security.debian.org/d'
            apt-get update
            apt-get install -y --no-install-recommends \
              git ca-certificates cmake build-essential pkg-config \
              libev-dev libgps-dev libgsl-dev libraw-dev \
              libusb-dev libusb-1.0-0-dev zlib1g-dev libftdi-dev \
              libjpeg-dev libkrb5-dev libnova-dev libtiff-dev \
              libfftw3-dev librtlsdr-dev libcfitsio-dev \
              libgphoto2-dev libdc1394-dev libboost-regex-dev \
              libcurl4-gnutls-dev libtheora-dev liberfa-dev
            rm -rf /tmp/indi-src /tmp/indi-stage
            git clone --depth 1 --branch "${{ steps.ref.outputs.ref }}" \
              https://github.com/indilib/indi.git /tmp/indi-src
            # A newer GCC than INDI 2.2.4 was written against flags a
            # snprintf bound computation in one bundled driver
            # (indi_astrotrac_telescope, which this build doesn't need) as
            # -Werror=stringop-overflow. Downgrade that one warning class to
            # non-fatal rather than chasing it driver by driver.
            cmake -S /tmp/indi-src -B /tmp/indi-build \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS=-Wno-error=stringop-overflow \
              -DINDI_BUILD_UNITTESTS=OFF \
              -DINDI_BUILD_INTEGTESTS=OFF
            cmake --build /tmp/indi-build -j"$(nproc)"
            mkdir -p /tmp/indi-stage
            DESTDIR=/tmp/indi-stage cmake --install /tmp/indi-build
            # INDI core is LGPL-2.1 (see COPYING.LGPL) — bundle the license
            # text and the exact source ref built, satisfying LGPL's source
            # + notice requirements for redistributing the compiled library.
            cp /tmp/indi-src/COPYING.LGPL /tmp/indi-stage/usr/local/
            printf 'Built from https://github.com/indilib/indi at ref %s\n' \
              "${{ steps.ref.outputs.ref }}" > /tmp/indi-stage/usr/local/SOURCE.txt
            cd /tmp/indi-stage/usr/local
            tar czf "$GITHUB_WORKSPACE/libindi-core-armhf-bullseye-${{ steps.ref.outputs.ref }}.tar.gz" \
              include/libindi lib/libindiclient* lib/libindidriver* lib/cmake/INDI lib/pkgconfig/*indi* COPYING.LGPL SOURCE.txt 2>/dev/null || \
            tar czf "$GITHUB_WORKSPACE/libindi-core-armhf-bullseye-${{ steps.ref.outputs.ref }}.tar.gz" \
              include/libindi lib COPYING.LGPL SOURCE.txt

      - name: Checksum
        run: |
          set -euo pipefail
          asset="libindi-core-armhf-bullseye-${{ steps.ref.outputs.ref }}.tar.gz"
          sha256sum "$asset" > "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libindi-core-armhf-bullseye-${{ steps.ref.outputs.ref }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "${ASSET}.sha256" --clobber
          else
            gh release create "$TAG" "$ASSET" "${ASSET}.sha256" \
              --title "$TAG" --notes "Prebuilt INDI core (headers + client lib) for armhf Raspberry Pi OS Bullseye, ARMv6. See docs/TROUBLESHOOTING.md."
          fi
