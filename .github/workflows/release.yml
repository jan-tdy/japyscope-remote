name: Release

# Builds the .tar.gz release asset install/update.py expects and attaches
# it (with a .sha256 sidecar) to the GitHub Release for the pushed tag.
# See RELEASE.md for the full release process and exactly what
# install/update.py validates about this asset.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Build release tarball
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ASSET="japyscope-remote-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="japyscope-remote-${TAG}/" -o "$ASSET" "$TAG"
          sha256sum "$ASSET" > "${ASSET}.sha256"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "${ASSET}.sha256" --clobber
          else
            gh release create "$TAG" "$ASSET" "${ASSET}.sha256" \
              --title "$TAG" --generate-notes
          fi
