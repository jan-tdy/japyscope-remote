<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JapyScope Remote — Docs</title>
<style>
  :root{
    --bg:#0c0808; --fg:#e8dcd6; --muted:#9c8a84;
    --accent:#c23b3b; --accent-dim:#7a2a2a;
    --panel-bg:#1c1414; --panel-border:#3a2626;
    --code-bg:#241919;
  }
  body{
    background: radial-gradient(ellipse at 50% -10%, rgba(194,59,59,0.10), transparent 55%), var(--bg);
    color:var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    margin:0; padding:24px 16px 60px;
  }
  header{ max-width:920px; margin:0 auto 18px; }
  h1{ font-size:1.3rem; margin:0 0 4px; color:#f2e4de; }
  header p{ color:var(--muted); font-size:.85rem; margin:0; }
  .tabbar{ max-width:920px; margin:0 auto 18px; display:flex; gap:8px; flex-wrap:wrap; }
  .tab-btn{
    font-family:inherit; font-size:.82rem; font-weight:600;
    background:var(--panel-bg); color:var(--muted); border:1px solid var(--panel-border);
    border-radius:8px; padding:9px 16px; cursor:pointer;
  }
  .tab-btn.active{ background:var(--accent-dim); color:#f4d9d3; border-color:var(--accent); }
  .tab-panel{ display:none; max-width:920px; margin:0 auto; }
  .tab-panel.active{ display:block; }
  .doc-panel{
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:10px;
    padding:20px 26px; line-height:1.6; font-size:.95rem;
  }
  .doc-panel h1, .doc-panel h2, .doc-panel h3{ color:#f2e4de; }
  .doc-panel a{ color:#e8a99a; }
  .doc-panel code{ background:var(--code-bg); padding:1px 5px; border-radius:4px; font-size:.85em; }
  .doc-panel pre{ background:var(--code-bg); padding:12px; border-radius:8px; overflow-x:auto; }
  .doc-panel pre code{ background:none; padding:0; }
  .doc-panel table{ border-collapse:collapse; width:100%; margin:1em 0; font-size:.85rem; }
  .doc-panel th, .doc-panel td{ border:1px solid var(--panel-border); padding:6px 10px; text-align:left; }
  .doc-panel th{ background:var(--code-bg); }
  .doc-loading, .doc-error{ color:var(--muted); font-size:.85rem; }
  .mockup-frame-wrap{ background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:10px; padding:10px; }
  .mockup-frame-wrap iframe{ width:100%; height:82vh; border:0; border-radius:6px; background:#fff; }
  .mockup-frame-wrap .fallback{ font-size:.8rem; color:var(--muted); margin:8px 2px 0; }
  .mockup-frame-wrap .fallback a{ color:#e8a99a; }
</style>
</head>
<body>
<header>
  <h1>JapyScope Remote</h1>
  <p>Custom Raspberry Pi Zero W hand controller + Web UI, by JapySoft. Interactive mockup, wiring, codes, and architecture docs — all in one place.</p>
</header>

<nav class="tabbar" id="tabbar"></nav>

<div id="panels"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function(){
  "use strict";

  // Order here is the nav order. "mockup" is special-cased (iframe, not
  // fetched/rendered as markdown) — everything else maps 1:1 to a .md file
  // living next to this page.
  var TABS = [
    { key: "mockup", label: "Mockup" },
    { key: "architecture", label: "Architecture", file: "ARCHITECTURE.md" },
    { key: "wiring", label: "Wiring", file: "WIRING.md" },
    { key: "codes", label: "Codes", file: "CODES.md" },
    { key: "install", label: "Install", file: "INSTALL.md" },
    { key: "update", label: "Update", file: "UPDATE.md" },
    { key: "troubleshooting", label: "Troubleshooting", file: "TROUBLESHOOTING.md" }
  ];
  var TABS_BY_KEY = {};
  TABS.forEach(function(t){ TABS_BY_KEY[t.key] = t; });

  var tabbarEl = document.getElementById("tabbar");
  var panelsEl = document.getElementById("panels");
  var loaded = {};

  TABS.forEach(function(tab){
    var btn = document.createElement("button");
    btn.className = "tab-btn";
    btn.textContent = tab.label;
    btn.dataset.tab = tab.key;
    btn.addEventListener("click", function(){ activateTab(tab.key); });
    tabbarEl.appendChild(btn);

    var panel = document.createElement("div");
    panel.className = "tab-panel";
    panel.id = "panel-" + tab.key;
    panelsEl.appendChild(panel);
  });

  function activateTab(key){
    var target = window.location.hash === "#" + key ? key : key; // explicit, no cleverness
    document.querySelectorAll(".tab-btn").forEach(function(b){
      b.classList.toggle("active", b.dataset.tab === target);
    });
    document.querySelectorAll(".tab-panel").forEach(function(p){
      p.classList.toggle("active", p.id === "panel-" + target);
    });
    if(window.location.hash !== "#" + target){
      history.replaceState(null, "", "#" + target);
    }
    ensureContent(target);
  }

  function ensureContent(key){
    if(loaded[key]) return;
    loaded[key] = true;
    var panel = document.getElementById("panel-" + key);
    if(key === "mockup"){
      panel.innerHTML =
        '<div class="mockup-frame-wrap">' +
          '<iframe src="mockup.html" title="JapyScope Remote interactive mockup"></iframe>' +
          '<p class="fallback">Nothing showing? <a href="mockup.html" target="_blank" rel="noopener">Open the mockup in a new tab</a> instead.</p>' +
        '</div>';
      return;
    }
    var tab = TABS_BY_KEY[key];
    panel.innerHTML = '<div class="doc-panel"><p class="doc-loading">Loading ' + tab.file + '…</p></div>';
    fetch(tab.file)
      .then(function(res){
        if(!res.ok) throw new Error(res.status + " " + res.statusText);
        return res.text();
      })
      .then(function(md){
        var html = window.marked ? marked.parse(md) : "<pre>" + escapeHtml(md) + "</pre>";
        var wrap = document.createElement("div");
        wrap.className = "doc-panel";
        wrap.innerHTML = html;
        interceptInternalMdLinks(wrap);
        panel.innerHTML = "";
        panel.appendChild(wrap);
      })
      .catch(function(err){
        panel.innerHTML = '<div class="doc-panel"><p class="doc-error">Could not load ' + tab.file +
          " (" + escapeHtml(String(err.message || err)) + '). If you opened this file directly ' +
          "from disk, serve docs/ over http(s) instead (fetch() of local .md files needs a real " +
          "server, e.g. <code>python3 -m http.server</code>).</p></div>";
      });
  }

  function interceptInternalMdLinks(container){
    container.querySelectorAll("a[href$=\".md\"]").forEach(function(a){
      var href = a.getAttribute("href");
      var match = TABS.find(function(t){ return t.file && href.replace(/^\.\//, "") === t.file; });
      if(!match) return; // external or unknown .md link — leave it alone
      a.addEventListener("click", function(e){
        e.preventDefault();
        activateTab(match.key);
      });
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; });
  }

  var initial = (window.location.hash || "#mockup").slice(1);
  activateTab(TABS_BY_KEY[initial] ? initial : "mockup");
})();
</script>
</body>
</html>
