#
# pyindi-client, installed separately with --no-deps (see install.sh and
# docs/INSTALL.md). Its PyPI metadata declares hard dependencies on
# bottle and dbus-python that the actual importable `PyIndi` module never
# uses (verified against the 2.2.0 sdist: no `import bottle`/`import dbus`
# anywhere in PyIndi/__init__.py or PyIndi/PyIndi.py — those are leftover
# from the unrelated example scripts). dbus-python cannot be built on the
# Pi Zero W (no armhf wheel, and its meson-python build needs ninja in a
# way that doesn't work in pip's isolated build sandbox on this hardware).
#
# Regenerate the hash list with:
#   pip download --no-deps --no-binary :none: pyindi-client==2.2.0 ...
# or copy the pyindi-client entry back out of a pip-compile run of
# requirements.txt with pyindi-client re-added, then remove it from
# requirements.lock again.
#
