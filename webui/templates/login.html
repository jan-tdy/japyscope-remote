{% extends "base.html" %}
{% block title %}Access · JapyScope{% endblock %}

{% block content %}
<h2>Access</h2>
<p>Enter the six-digit code shown on the controller.</p>

<form method="post" style="max-width: 18rem; margin: 1.25rem 0;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="login-code">Code</label>
  <input id="login-code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus placeholder="000000" style="font-size: 1.2rem; letter-spacing: 0.15em; text-align: center;">
  <div style="margin-top: 1rem;">
    <button type="submit" class="primary" style="width: 100%;">Enter</button>
  </div>
</form>

<p class="muted">Generate a code under Menu &rarr; Wi-Fi / Web Access. Five wrong attempts cause a 30-second lockout.</p>
{% endblock %}
