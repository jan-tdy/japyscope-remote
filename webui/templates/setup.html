{% extends "base.html" %}{% block title %}Wi-Fi setup · JapyScope{% endblock %}
{% block content %}<h2>Wi-Fi setup</h2><p>While connected to <strong>JapyScope-Setup</strong>, enter the home network details.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>SSID <input name="ssid" maxlength="32" required></label><label>Password <input name="password" type="password" minlength="8" maxlength="63" required></label><button>Connect</button></form>
<p class="muted">The setup hotspot disappears after the controller joins the network.</p>{% endblock %}
