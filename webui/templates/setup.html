{% extends "base.html" %}
{% block title %}Wi-Fi setup · JapyScope{% endblock %}

{% block content %}
<h2>Wi-Fi Setup</h2>
<p>While connected to <strong>JapyScope-Setup</strong>, enter the network details to connect the telescope.</p>

<form method="post" style="max-width: 22rem; margin: 1.25rem 0;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  
  <label for="ssid">SSID</label>
  <input id="ssid" name="ssid" maxlength="32" required placeholder="Network name">
  
  <label for="password">Password</label>
  <input id="password" name="password" type="password" minlength="8" required placeholder="Network password">
  
  <div style="margin-top: 1rem;">
    <button type="submit" class="primary" style="width: 100%;">Connect</button>
  </div>
</form>

<p class="muted">The setup hotspot disappears after the controller joins the network.</p>
{% endblock %}
