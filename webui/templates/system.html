{% extends "base.html" %}
{% block title %}System · JapyScope{% endblock %}

{% block content %}
<h2>System</h2>
<p class="muted">No mount controls are available here. Telescope slewing and alignment remain controller-only.</p>

<section>
  <h3>Service Control</h3>
  <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem;">
    <form method="post" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="action" value="restart-controller">
      <button type="submit">Restart controller service</button>
    </form>
    
    <form method="post" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="action" value="wifi-setup">
      <button type="submit">Restart Wi-Fi setup</button>
    </form>
  </div>
</section>

<section>
  <h3>Power Management</h3>
  <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem;">
    <form method="post" class="inline" onsubmit="return confirm('Reboot the Raspberry Pi?')">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="action" value="reboot">
      <button type="submit" class="danger">Reboot Raspberry Pi</button>
    </form>

    <form method="post" class="inline" onsubmit="return confirm('Power off the Raspberry Pi completely?')">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="action" value="poweroff">
      <button type="submit" class="danger">Power off Raspberry Pi</button>
    </form>
  </div>
</section>

<section>
  <h3>Session</h3>
  <div style="margin-top: 0.5rem;">
    <form method="post" action="{{ url_for('logout') }}" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">Log out</button>
    </form>
  </div>
</section>
{% endblock %}
